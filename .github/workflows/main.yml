name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  package:
    name: create blender addon package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Zip up package
        run: zip -r sket_unreal_${RELEASE_VERSION}.zip sket_unreal -x '*__pycache__*' '*.pyc'
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: sket_unreal_*.zip
